<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ Hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .cart-item img {
      width: 100px;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      transition: transform 0.3s ease-in-out;
    }

    .cart-item img:hover {
      transform: scale(1.05);
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>

<div class="container mt-5 mb-5">
  <div th:if="${listCartItems.isEmpty()}" class="text-center p-5 bg-white rounded shadow">
    <h3>🛒 Giỏ hàng của bạn đang trống!</h3>
    <a th:href="@{/home_user_after_login}" class="btn btn-outline-primary d-inline-block px-3 py-2">
       Quay về trang chủ
    </a>
  </div>

  <div th:unless="${listCartItems.isEmpty()}">
    <!-- Tiêu đề -->
    <div class="text-center mb-4">
      <h3 class="fw-bold">
        🛍️ Giỏ hàng của bạn có <span th:text="${listCartItems.size()}"></span> sản phẩm
      </h3>
    </div>

    <!-- Tổng tiền và chọn tất cả -->
    <div class="sticky-top bg-white py-3 border-bottom">
      <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="selectAllCheckbox">
          <label class="form-check-label" for="selectAllCheckbox">Chọn tất cả</label>
        </div>

        <span class="fw-semibold text-danger fs-5">
      Tổng tiền: <span th:text="${totalPrice}"></span> VNĐ
    </span>

        <a href="#" class="btn btn-success px-4">🧾 Thanh toán</a>
      </div>
    </div>


    <!-- Sản phẩm trong giỏ -->
    <div th:each="item : ${listCartItems}" class="card mb-3 shadow-sm border-0 cart-item">
      <div class="row g-0 align-items-center p-2">
        <!-- Cột ảnh và checkbox -->
        <div class="col-md-2 text-center">
          <input type="checkbox" name="selectedProduct" value="itemId" class="form-check-input mb-2">
          <img th:src="@{/images/sach-anh-dep3.jpg}" th:alt="${item.book.nameBook}" class="img-fluid">
        </div>

        <!-- Cột chi tiết sản phẩm -->
        <div class="col-md-8">
          <div class="card-body">
            <h5 class="card-title fw-bold mb-2">
              📘 <span th:text="${item.book.nameBook}"></span>
            </h5>
            <p class="mb-1">✍️ Tác giả: <span th:text="${item.book.nameAuthor}"></span></p>
            <p class="mb-1 text-secondary">
              🌐 <strong>Ngôn ngữ:</strong> <span th:text="${item.book.language}"></span>
            </p>
            <p class="mb-1">💲 Giá: <span th:text="${item.book.price}"></span> VNĐ</p>
            <div class="input-group mt-2" style="max-width: 160px;">
              <button type="button" class="btn btn-outline-secondary decrease-btn">−</button>
              <input type="number"
                     name="quantityInCart"
                     class="form-control text-center"
                     th:value="${item.quantity}"
                     min="1"
                     step="1"
                     th:max="${item.book.quantity}"
                     required>
              <button type="button" class="btn btn-outline-secondary increase-btn">+</button>
            </div>
          </div>
        </div>

        <!-- Cột nút Xóa -->
        <div class="col-md-2 text-center">
          <form method="post" th:action="@{/home_after_user_login/move_cart/remove_out_cart}">
            <input type="hidden" th:name="itemId" th:value="${item.cartItemId}" />
            <button type="submit" class="btn btn-outline-danger mt-3">
              🗑 Xóa
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Script tăng giảm số lượng -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const cartItems = document.querySelectorAll('.cart-item');

    cartItems.forEach(item => {
      const decreaseBtn = item.querySelector('.decrease-btn');
      const increaseBtn = item.querySelector('.increase-btn');
      const quantityInput = item.querySelector('input[name="quantityInCart"]');

      decreaseBtn.addEventListener("click", () => {
        let current = parseInt(quantityInput.value);
        if (current > 1) quantityInput.value = current - 1;
      });

      increaseBtn.addEventListener("click", () => {
        let current = parseInt(quantityInput.value);
        let max = parseInt(quantityInput.max);
        if (current < max) quantityInput.value = current + 1;
      });
    });

    // Chức năng "Chọn tất cả"
    const selectAll = document.getElementById("selectAllCheckbox");
    const checkboxes = document.querySelectorAll('input[name="selectedProduct"]');

    selectAll.addEventListener("change", function () {
      checkboxes.forEach(cb => cb.checked = this.checked);
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
