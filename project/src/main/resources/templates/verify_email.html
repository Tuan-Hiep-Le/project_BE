<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .input-focus:focus {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .success-animation {
            animation: successPulse 2s ease-in-out infinite;
        }
        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .error-shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">

    <!-- Success State - Thymeleaf Logic Preserved -->
    <div th:if="${userVerified}" class="bg-white rounded-2xl p-8 card-shadow text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Tài khoản của bạn đã được xác thực!</h2>
        <button onclick="window.location.href='/home_user_after_login'" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 btn-hover">
            Trở về trang chủ
        </button>
    </div>

    <!-- Verification State - Thymeleaf Logic Preserved -->
    <div th:unless="${userVerified}" class="bg-white rounded-2xl p-8 card-shadow">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Xác thực Email</h2>
            <p class="text-gray-600">Mã xác thực đã được gửi đến email của bạn. Vui lòng kiểm tra hộp thư và nhập mã bên dưới.</p>
            <p>Mã sẽ hết hạn sau 15 phút.</p>
        </div>

        <!-- Original Thymeleaf Form - Logic Unchanged -->
        <form th:action="@{/verify_email_for_user}" method="post" class="space-y-6">
            <div>
                <label for="tokenVerify" class="block text-sm font-medium text-gray-700 mb-2">Nhập mã xác thực:</label>
                <input
                        type="text"
                        id="tokenVerify"
                        name="tokenVerify"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 input-focus text-center text-lg font-mono tracking-widest"
                        placeholder="Nhập mã 8 số"
                        autocomplete="off"
                >
            </div>

            <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 btn-hover focus:ring-4 focus:ring-blue-200"
            >
                Xác thực
            </button>
        </form>

        <!-- Original Thymeleaf Error Message - Logic Unchanged -->
        <div th:if="${isVerify == false}" class="bg-red-50 border border-red-200 rounded-xl p-4 mt-4 error-shake">
            <div class="flex items-center">
                <svg class="w-5 h-5 text-red-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-red-700 text-sm font-medium">Mã xác thực không đúng</p>
            </div>
        </div>

        <!-- Original Thymeleaf Resend Form - Logic Unchanged -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <div class="text-center">
                <p class="text-gray-600 text-sm mb-4">Không nhận được mã?</p>
                <form th:action="@{/send_email}" method="get" class="inline">
                    <button
                            type="submit"
                            class="text-blue-600 hover:text-blue-700 font-medium text-sm transition-colors duration-300 hover:underline bg-transparent border-none cursor-pointer"
                    >
                        Gửi lại mã xác thực
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</html>
