<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng Ký</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.05)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.08)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
      pointer-events: none;
    }

    .register-container {
      position: relative;
      z-index: 1;
      padding: 2rem 0;
    }

    .register-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.1),
        0 0 0 1px rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.3s ease;
    }

    .register-box:hover {
      transform: translateY(-2px);
      box-shadow:
        0 25px 50px rgba(0,0,0,0.15),
        0 0 0 1px rgba(255,255,255,0.3);
    }

    .register-title {
      background: linear-gradient(135deg, #10b981, #059669);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .register-subtitle {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-label {
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .form-control {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 0.875rem 1rem;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.8);
    }

    .form-control:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
      background: rgba(255,255,255,1);
      transform: translateY(-1px);
    }

    .form-control::placeholder {
      color: #9ca3af;
    }

    .form-text {
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }

    .form-text.text-muted {
      color: #6b7280 !important;
      background: rgba(59, 130, 246, 0.1);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border-left: 3px solid #3b82f6;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-text.text-muted::before {
      content: '💡';
      font-size: 0.9rem;
    }

    .form-text.text-danger {
      color: #dc2626 !important;
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid #fca5a5;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .form-text.text-danger::before {
      content: '⚠️';
      font-size: 1rem;
    }

    .btn-register {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 12px;
      padding: 0.875rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-register::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }

    .btn-register:hover::before {
      left: 100%;
    }

    .btn-register:active {
      transform: translateY(0);
    }

    .links-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }

    .auth-link {
      color: #10b981;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .auth-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 0;
      background: linear-gradient(135deg, #10b981, #059669);
      transition: width 0.3s ease;
    }

    .auth-link:hover {
      color: #059669;
      transform: translateY(-1px);
    }

    .auth-link:hover::after {
      width: 100%;
    }

    .floating-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 15%;
      left: 10%;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 60px;
      height: 60px;
      top: 70%;
      right: 15%;
      animation-delay: 2s;
    }

    .shape:nth-child(3) {
      width: 40px;
      height: 40px;
      top: 85%;
      left: 20%;
      animation-delay: 4s;
    }

    .shape:nth-child(4) {
      width: 50px;
      height: 50px;
      top: 40%;
      right: 10%;
      animation-delay: 1s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }

    .row {
      margin-left: -0.5rem;
      margin-right: -0.5rem;
    }

    .row > * {
      padding-left: 0.5rem;
      padding-right: 0.5rem;
    }

    @media (max-width: 576px) {
      .register-box {
        margin: 1rem;
        padding: 2rem 1.5rem;
      }

      .register-title {
        font-size: 1.75rem;
      }

      .register-container {
        padding: 1rem 0;
      }
    }
  </style>
</head>
<body>
<div class="floating-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100 register-container">
  <div class="register-box w-100" style="max-width: 480px;">
    <div class="text-center">
      <h3 class="register-title">📝 Đăng ký tài khoản</h3>
      <p class="register-subtitle">Tạo tài khoản mới để bắt đầu hành trình của bạn với chúng tôi!</p>
    </div>

    <form th:action="@{/register}" method="post" th:object="${user}">
      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="lastName" class="form-label">👤 Họ đệm</label>
            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" placeholder="Nhập họ đệm" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="firstName" class="form-label">✨ Tên</label>
            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" placeholder="Nhập tên" required>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">📧 Địa chỉ Email</label>
        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="example@gmail.com" required>
        <div class="form-text text-muted">
          Gmail có đuôi @gmail.com!
        </div>
      </div>
      <div class="form-text text-danger" th:if="${isEmailExist}">
        Email đã được sử dụng. Vui lòng thử email khác.
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">📱 Số điện thoại</label>
        <input type="text" class="form-control" id="phone" th:field="*{phoneNumber}"  required>
        <div class="form-text text-muted">
          Có 10 chữ số và bắt đầu bằng số 0!
        </div>
      </div>
      <div class="form-text text-danger" th:if="${isNumberPhoneValid == false}">
        Số điện thoại không hợp lệ.
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">🔒 Mật khẩu</label>
        <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Tạo mật khẩu mạnh" required>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label">🔐 Nhập lại mật khẩu</label>
        <input type="password" name="rePassword" class="form-control" id="confirmPassword" placeholder="Xác nhận mật khẩu" required>
      </div>
      <div class="form-text text-danger" th:if="${isValidPassword == false}">
        Mật khẩu không trùng khớp.
      </div>

      <button type="submit" class="btn btn-register w-100">
        🎉 Tạo tài khoản ngay
      </button>

      <div class="text-center links-section">
        <small>Bạn đã có tài khoản? <a th:href="@{/login}" class="auth-link">Đăng nhập ngay</a></small>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</html>
