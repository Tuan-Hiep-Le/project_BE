<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Admin - Hiệu Sách Của Hiệp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin-home.css}">
    <link rel="stylesheet" th:href="@{/css/overview.css}">
    <link rel="stylesheet" th:href="@{/css/manage-book.css}">
    <link rel="stylesheet" th:href="@{/css/manage-order.css}">
</head>
<body class="admin-home bg-gray-50 min-h-screen">
<!-- Header -->
<header class="gradient-bg shadow-lg relative z-40">
    <div class="px-8 py-5">
        <div class="flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-4">
                <div class="bg-white bg-opacity-20 p-4 rounded-full">
                    <i class="fas fa-book text-white text-2xl"></i>
                </div>
                <h1 class="text-white text-3xl font-bold">Hiệu Sách Của Hiệp</h1>
            </div>

            <!-- User Profile -->
            <div class="relative">
                <button id="profileToggle" class="flex items-center space-x-4 bg-white bg-opacity-20 rounded-full p-3 hover:bg-opacity-30 transition-all duration-300">
                        <div th:if="${hasAvatar}">
                            <img th:src="@{${avatar}}"
                                alt="Avatar"
                                class="w-14 h-14 rounded-full border-2 border-white object-cover">
                            <span class="text-white font-medium text-lg" th:text="${username}">Admin</span>
                        </div>

                        <div th:unless="${hasAvatar}">
                            <img th:src="@{/images/sach-anh-dep3.jpg}"
                                 alt="Avatar"
                                class="w-14 h-14 rounded-full border-2 border-white object-cover">
                            <span class="text-white font-medium text-lg" th:text="${username}">Admin</span>
                        </div>

                </button>

                <!-- Dropdown Menu -->
                <div id="profileDropdown" class="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-xl border-0 py-2 hidden">
                    <div class="px-4 py-3 border-b border-gray-100">
                        <p class="text-sm font-medium text-gray-900">Xin chào, Admin!</p>
                    </div>
                    <a th:href="@{/homepage/move_edit_personal}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors">
                        <i class="fas fa-user mr-3 text-blue-500"></i>
                        Trang cá nhân
                    </a>
                    <a th:href="@{/histories_login}" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors">
                        <i class="fas fa-history mr-3 text-green-500"></i>
                        Lịch sử đăng nhập
                    </a>
                    <a href="#" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors">
                        <i class="fas fa-cog mr-3 text-gray-500"></i>
                        Cài đặt
                    </a>
                    <hr class="my-2">
                    <a th:href="@{/logout}" class="flex items-center px-4 py-3 text-red-600 hover:bg-red-50 transition-colors">
                        <i class="fas fa-sign-out-alt mr-3"></i>
                        Đăng xuất
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Sidebar -->
<aside class="fixed left-0 top-0 h-full w-72 gradient-bg z-30">
    <div class="p-8 pt-32">

        <div class="space-y-3">
            <div class="text-white text-sm font-medium mb-6 opacity-75 uppercase tracking-wider">QUẢN LÝ</div>

            <a th:href="@{/admin}" class="sidebar-item flex items-center space-x-4 text-white p-4 rounded-xl text-lg">
                <i class="fas fa-book-open w-6 text-xl"></i>
                <span>Tổng quan</span>
            </a>

            <a th:href="@{/admin/manage_book}" class="sidebar-item flex items-center space-x-4 text-white p-4 rounded-xl text-lg">
                <i class="fas fa-book-open w-6 text-xl"></i>
                <span>Quản lý sách</span>
            </a>

            <a href="#" class="sidebar-item flex items-center space-x-4 text-white p-4 rounded-xl text-lg">
                <i class="fas fa-users w-6 text-xl"></i>
                <span>Quản lý người dùng</span>
            </a>

            <a th:href="@{/admin/move_manage_order}" class="sidebar-item flex items-center space-x-4 text-white p-4 rounded-xl text-lg">
                <i class="fas fa-shopping-cart w-6 text-xl"></i>
                <span>Quản lý đơn hàng</span>
            </a>

            <a href="#" class="sidebar-item flex items-center space-x-4 text-white p-4 rounded-xl text-lg">
                <i class="fas fa-ticket-alt w-6 text-xl"></i>
                <span>Quản lý voucher</span>
            </a>

            <div class="pt-6">
                <div class="text-white text-sm font-medium mb-6 opacity-75 uppercase tracking-wider">THỐNG KÊ</div>
                <a href="#" class="sidebar-item flex items-center space-x-4 text-white p-4 rounded-xl text-lg">
                    <i class="fas fa-chart-bar w-6 text-xl"></i>
                    <span>Dashboard</span>
                </a>
            </div>
        </div>
    </div>
</aside>

<!-- Main Content -->
<main class="ml-72 min-h-screen">
    <div class="p-10">
        <!-- Content Area - Ready for your fragments -->
        <div class="bg-white rounded-2xl shadow-lg p-10">
            <!-- Your Thymeleaf content will be inserted here -->
            <div id="content-placeholder">
                <main th:replace="${section} :: ${section}"></main>
                <!-- This is where your manage_book fragment or other content will appear -->
            </div>
        </div>
    </div>
</main>

<script>
    // Profile dropdown toggle
    const profileToggle = document.getElementById('profileToggle');
    const profileDropdown = document.getElementById('profileDropdown');

    profileToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        profileDropdown.classList.toggle('hidden');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!profileToggle.contains(e.target) && !profileDropdown.contains(e.target)) {
            profileDropdown.classList.add('hidden');
        }
    });

    // Additional functionality can be added here as needed
</script>

</html>
