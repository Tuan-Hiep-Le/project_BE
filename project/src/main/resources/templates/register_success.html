<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tạo tài khoản thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal */
        .modal-content {
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            animation: fadeInUp 0.4s ease-out;
        }
        @keyframes fadeInUp {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }

        .modal-title {
            font-weight: 700;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Success icon */
        .success-icon {
            width: 100px; height: 100px;
            margin: 1.5rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            display: flex; align-items: center; justify-content: center;
            animation: pulse 2s infinite;
        }
        .success-icon::before { content: '✅'; font-size: 2.5rem; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }

        .success-message {
            color: #6b7280;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Button */
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none; border-radius: 10px;
            padding: 0.8rem 2rem;
            font-weight: 600;
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(16, 185, 129, 0.3);
        }
        .btn-success:active { transform: translateY(0); }

        /* Floating background shapes (giữ ít hơn để nhẹ hơn) */
        .floating-shapes {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
        }
        .shape {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }
        .shape:nth-child(1) { width: 70px; height: 70px; top: 20%; left: 10%; }
        .shape:nth-child(2) { width: 50px; height: 50px; top: 60%; right: 15%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 40px; height: 40px; top: 75%; left: 20%; animation-delay: 4s; }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        @media (max-width: 576px) {
            .modal-title { font-size: 1.3rem; }
            .success-icon { width: 80px; height: 80px; }
            .success-icon::before { font-size: 2rem; }
        }
    </style>
</head>
<body>
<div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
            <div class="success-icon"></div>
            <div class="modal-header border-0">
                <h5 class="modal-title">Tạo tài khoản thành công!</h5>
            </div>
            <div class="modal-body">
                <p class="success-message">
                    🎉 Chúc mừng! Tài khoản của bạn tạo thành công.<br>
                    Hãy đăng nhập để bắt đầu sử dụng dịch vụ của chúng tôi.
                </p>
            </div>
            <div class="modal-footer border-0">
                <a th:href="@{/login}" class="btn btn-success">
                    🔐 Đến trang đăng nhập
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modal = new bootstrap.Modal(document.getElementById('successModal'));
        modal.show();
    });
</script>
</body>
</html>
