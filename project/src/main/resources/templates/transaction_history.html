<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Giao Dịch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Lịch Sử Giao Dịch</h1>
        <p class="text-gray-600">Quản lý và theo dõi các giao dịch của bạn</p>
    </div>

    <!-- Transaction Table -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white">
                <tr>
                    <th class="px-6 py-4 text-left font-semibold">Mã Giao Dịch</th>
                    <th class="px-6 py-4 text-left font-semibold">Thời Gian</th>
                    <th class="px-6 py-4 text-left font-semibold">Số Tiền</th>
                    <th class="px-6 py-4 text-left font-semibold">Loại Giao Dịch</th>
                    <th class="px-6 py-4 text-left font-semibold">Trạng Thái</th>
                </tr>
                </thead>
                <tbody id="transactionTable">
                <!-- Transaction rows will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal for Order Details -->
<div id="orderModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="p-6 border-b border-gray-200">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">Chi Tiết Đơn Hàng</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl font-bold">×</button>
            </div>
        </div>

        <div class="p-6">
            <div id="orderDetails" class="space-y-4">
                <!-- Order details will be populated by JavaScript -->
            </div>
        </div>

        <div class="p-6 border-t border-gray-200 flex justify-end">
            <button onclick="closeModal()" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                Đóng
            </button>
        </div>
    </div>
</div>

<script>
    // Sample transaction data
    const transactions = [
        {
            id: 'TXN001',
            time: '2024-01-15 14:30:25',
            amount: 250000,
            type: 'Mua hàng',
            status: 'Hoàn thành',
            orderDetails: {
                customerName: 'Nguyễn Văn A',
                phone: '0123456789',
                address: '123 Đường ABC, Quận 1, TP.HCM',
                items: [
                    { name: 'Áo thun nam', quantity: 2, price: 150000 },
                    { name: 'Quần jean', quantity: 1, price: 350000 }
                ],
                shipping: 50000,
                total: 650000
            }
        },
        {
            id: 'TXN002',
            time: '2024-01-15 10:15:42',
            amount: 180000,
            type: 'Hoàn tiền',
            status: 'Đã xử lý',
            orderDetails: {
                customerName: 'Trần Thị B',
                phone: '0987654321',
                address: '456 Đường XYZ, Quận 3, TP.HCM',
                items: [
                    { name: 'Giày thể thao', quantity: 1, price: 450000 }
                ],
                refundReason: 'Sản phẩm lỗi',
                refundAmount: 450000
            }
        },
        {
            id: 'TXN003',
            time: '2024-01-14 16:45:18',
            amount: 320000,
            type: 'Mua hàng',
            status: 'Đang xử lý',
            orderDetails: {
                customerName: 'Lê Văn C',
                phone: '0369852147',
                address: '789 Đường DEF, Quận 7, TP.HCM',
                items: [
                    { name: 'Túi xách nữ', quantity: 1, price: 280000 },
                    { name: 'Ví da', quantity: 1, price: 120000 }
                ],
                shipping: 30000,
                total: 430000
            }
        },
        {
            id: 'TXN004',
            time: '2024-01-14 09:20:33',
            amount: 95000,
            type: 'Mua hàng',
            status: 'Hoàn thành',
            orderDetails: {
                customerName: 'Phạm Thị D',
                phone: '0741258963',
                address: '321 Đường GHI, Quận 5, TP.HCM',
                items: [
                    { name: 'Mũ lưỡi trai', quantity: 1, price: 85000 },
                    { name: 'Khăn choàng', quantity: 1, price: 65000 }
                ],
                shipping: 25000,
                total: 175000
            }
        },
        {
            id: 'TXN005',
            time: '2024-01-13 13:55:07',
            amount: 420000,
            type: 'Mua hàng',
            status: 'Đã hủy',
            orderDetails: {
                customerName: 'Hoàng Văn E',
                phone: '0852963741',
                address: '654 Đường JKL, Quận 2, TP.HCM',
                items: [
                    { name: 'Đồng hồ thông minh', quantity: 1, price: 1200000 }
                ],
                cancelReason: 'Khách hàng hủy đơn',
                cancelTime: '2024-01-13 15:30:00'
            }
        }
    ];

    function formatCurrency(amount) {
        return new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND'
        }).format(amount);
    }

    function getStatusColor(status) {
        switch(status) {
            case 'Hoàn thành': return 'bg-green-100 text-green-800';
            case 'Đang xử lý': return 'bg-yellow-100 text-yellow-800';
            case 'Đã xử lý': return 'bg-blue-100 text-blue-800';
            case 'Đã hủy': return 'bg-red-100 text-red-800';
            default: return 'bg-gray-100 text-gray-800';
        }
    }

    function getTypeColor(type) {
        switch(type) {
            case 'Mua hàng': return 'bg-blue-100 text-blue-800';
            case 'Hoàn tiền': return 'bg-orange-100 text-orange-800';
            default: return 'bg-gray-100 text-gray-800';
        }
    }

    function renderTransactions() {
        const tableBody = document.getElementById('transactionTable');
        tableBody.innerHTML = '';

        transactions.forEach(transaction => {
            const row = document.createElement('tr');
            row.className = 'border-b border-gray-200 hover:bg-gray-50 cursor-pointer transition-colors';
            row.onclick = () => showOrderDetails(transaction);

            row.innerHTML = `
                <td class="px-6 py-4 font-medium text-blue-600">${transaction.id}</td>
                <td class="px-6 py-4 text-gray-700">${transaction.time}</td>
                <td class="px-6 py-4 font-semibold text-gray-900">${formatCurrency(transaction.amount)}</td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 rounded-full text-sm font-medium ${getTypeColor(transaction.type)}">
                        ${transaction.type}
                    </span>
                </td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 rounded-full text-sm font-medium ${getStatusColor(transaction.status)}">
                        ${transaction.status}
                    </span>
                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    function showOrderDetails(transaction) {
        const modal = document.getElementById('orderModal');
        const detailsContainer = document.getElementById('orderDetails');

        let detailsHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <h3 class="text-lg font-semibold text-gray-800 border-b pb-2">Thông Tin Giao Dịch</h3>
                    <div><span class="font-medium text-gray-600">Mã giao dịch:</span> <span class="text-blue-600 font-medium">${transaction.id}</span></div>
                    <div><span class="font-medium text-gray-600">Thời gian:</span> ${transaction.time}</div>
                    <div><span class="font-medium text-gray-600">Số tiền:</span> <span class="font-bold text-green-600">${formatCurrency(transaction.amount)}</span></div>
                    <div><span class="font-medium text-gray-600">Loại giao dịch:</span>
                        <span class="px-2 py-1 rounded text-sm ${getTypeColor(transaction.type)}">${transaction.type}</span>
                    </div>
                    <div><span class="font-medium text-gray-600">Trạng thái:</span>
                        <span class="px-2 py-1 rounded text-sm ${getStatusColor(transaction.status)}">${transaction.status}</span>
                    </div>
                </div>

                <div class="space-y-3">
                    <h3 class="text-lg font-semibold text-gray-800 border-b pb-2">Thông Tin Khách Hàng</h3>
                    <div><span class="font-medium text-gray-600">Tên khách hàng:</span> ${transaction.orderDetails.customerName}</div>
                    <div><span class="font-medium text-gray-600">Số điện thoại:</span> ${transaction.orderDetails.phone}</div>
                    <div><span class="font-medium text-gray-600">Địa chỉ:</span> ${transaction.orderDetails.address}</div>
                </div>
            </div>
        `;

        if (transaction.orderDetails.items) {
            detailsHTML += `
                <div class="mt-6">
                    <h3 class="text-lg font-semibold text-gray-800 border-b pb-2 mb-4">Chi Tiết Sản Phẩm</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full border border-gray-200 rounded-lg">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left font-medium text-gray-700">Sản phẩm</th>
                                    <th class="px-4 py-3 text-center font-medium text-gray-700">Số lượng</th>
                                    <th class="px-4 py-3 text-right font-medium text-gray-700">Đơn giá</th>
                                    <th class="px-4 py-3 text-right font-medium text-gray-700">Thành tiền</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            transaction.orderDetails.items.forEach(item => {
                detailsHTML += `
                    <tr class="border-t border-gray-200">
                        <td class="px-4 py-3">${item.name}</td>
                        <td class="px-4 py-3 text-center">${item.quantity}</td>
                        <td class="px-4 py-3 text-right">${formatCurrency(item.price)}</td>
                        <td class="px-4 py-3 text-right font-medium">${formatCurrency(item.price * item.quantity)}</td>
                    </tr>
                `;
            });

            if (transaction.orderDetails.shipping) {
                detailsHTML += `
                    <tr class="border-t border-gray-200 bg-gray-50">
                        <td class="px-4 py-3 font-medium" colspan="3">Phí vận chuyển</td>
                        <td class="px-4 py-3 text-right font-medium">${formatCurrency(transaction.orderDetails.shipping)}</td>
                    </tr>
                `;
            }

            if (transaction.orderDetails.total) {
                detailsHTML += `
                    <tr class="border-t-2 border-gray-300 bg-blue-50">
                        <td class="px-4 py-3 font-bold text-lg" colspan="3">Tổng cộng</td>
                        <td class="px-4 py-3 text-right font-bold text-lg text-blue-600">${formatCurrency(transaction.orderDetails.total)}</td>
                    </tr>
                `;
            }

            detailsHTML += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        if (transaction.orderDetails.refundReason) {
            detailsHTML += `
                <div class="mt-6 p-4 bg-orange-50 rounded-lg border border-orange-200">
                    <h3 class="text-lg font-semibold text-orange-800 mb-2">Thông Tin Hoàn Tiền</h3>
                    <div><span class="font-medium text-orange-700">Lý do:</span> ${transaction.orderDetails.refundReason}</div>
                    <div><span class="font-medium text-orange-700">Số tiền hoàn:</span> <span class="font-bold">${formatCurrency(transaction.orderDetails.refundAmount)}</span></div>
                </div>
            `;
        }

        if (transaction.orderDetails.cancelReason) {
            detailsHTML += `
                <div class="mt-6 p-4 bg-red-50 rounded-lg border border-red-200">
                    <h3 class="text-lg font-semibold text-red-800 mb-2">Thông Tin Hủy Đơn</h3>
                    <div><span class="font-medium text-red-700">Lý do:</span> ${transaction.orderDetails.cancelReason}</div>
                    <div><span class="font-medium text-red-700">Thời gian hủy:</span> ${transaction.orderDetails.cancelTime}</div>
                </div>
            `;
        }

        detailsContainer.innerHTML = detailsHTML;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeModal() {
        const modal = document.getElementById('orderModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    // Close modal when clicking outside
    document.getElementById('orderModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });

    // Initialize the page
    renderTransactions();
</script>

</html>
