<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main th:fragment="manage_order" class="container my-4">
    <div>
        <form th:action="@{/admin/manage_order/filter_order}" method="post" >
        <div class="col-md-3">
            <label class="form-label fw-semibold">Trạng thái:</label>
            <select id="statusFilter" name="filterOrder" class="form-select" onchange="this.form.submit()">
                <option value="all" th:selected="${filterOrder == 'all'}">Tất cả đơn hàng</option>
                <option value="pending" th:selected="${filterOrder == 'pending'}">Đang chờ xử lý</option>
                <option value="accepted" th:selected="${filterOrder == 'accepted'}">Đã chấp nhận</option>
                <option value="refused" th:selected="${filterOrder == 'refused'}">Đã hủy</option>
            </select>
        </div>
        </form>

        <form th:action="@{/admin/manage_order/filter_payment}" method="post" >
            <div class="col-md-3">
                <label class="form-label fw-semibold">Phương thức thanh toán:</label>
                <select id="methodPaymentFilter" name="filterMethod" class="form-select" onchange="this.form.submit()">
                    <option value="all" th:selected="${filterMethod == 'all'}">Tất cả</option>
                    <option value="cash" th:selected="${filterMethod == 'cash'}">Tiền mặt</option>
                    <option value="transfer" th:selected="${filterMethod == 'transfer'}">Chuyển khoản</option>

                </select>
            </div>
        </form>



        <div class="row mt-3">
            <div class="col-md-12">
                <input type="text" id="searchFilter" name="findOrder" class="form-control" placeholder="🔍 Tìm kiếm theo tên khách hàng, mã đơn hàng...">
            </div>
        </div>
    </div>
    <div class="mb-3">
        <form th:action="@{/admin/manage_order/save}" method="post" class="mb-4">
            <input type="hidden" name="filterOrder" th:value="${filterOrder}">
            <input type="hidden" name="valuePage" th:value="${valuePage}">
            <div class="table-responsive shadow-sm rounded">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Mã đơn hàng</th>
                        <th>Ngày đặt hàng</th>
                        <th>ID khách hàng</th>
                        <th>Tên khách hàng</th>
                        <th>Tổng tiền</th>
                        <th>Phương thức thanh toán</th>
                        <th>Địa chỉ giao hàng</th>
                        <th>Trạng thái</th>
                    </tr>

                    </thead>
                    <tbody>
                    <tr th:each="order : ${listOrder}">
                        <td th:text="${order[0]}"></td>
                        <td th:text="${#temporals.format(order[1], 'dd/MM/yyyy')}"></td>
                        <td th:text="${order[2]}"></td>
                        <td th:text="${order[3]}"></td>
                        <td th:text="${order[4]}"></td>
                        <td>
                            <span th:switch="${order[5]}">
                                <span th:case="${T(com.project.entity.enum_entity.PaymentMethod).CASH}">Tiền mặt</span>
                                <span th:case="${T(com.project.entity.enum_entity.PaymentMethod).TRANSFER}">Chuyển khoản</span>
                            </span>
                        </td>

                        <td th:text="${order[6]}"></td>
                        <td>
                            <input type="hidden" name="orderId" th:value="${order[0]}">
                            <select name="handlerOrder" class="form-select form-select-sm">
                                <option th:selected="${order[7] == null}" value="">Đang chờ xử lý</option>
                                <option th:selected="${order[7] != null and order[7].name() == 'ACCEPT'}" value="ACCEPT">Chấp nhận</option>
                                <option th:selected="${order[7] != null and order[7].name() == 'REFUSE'}" value="REFUSE">Đã hủy</option>
                            </select>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
    <div class="pagination-container">
        <nav aria-label="Pagination">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${valuePage==0} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/move_manage_order(valuePage=${valuePage-1} , openMenu=${true})}">
                        <i class="fas fa-chevron-left me-1"></i>Previous
                    </a>
                </li>
                <li class="page-item" th:each="p : ${#numbers.sequence(0,totalPage - 1)}" th:classappend="${p == valuePage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/move_manage_order(valuePage=${p} , openMenu = ${true})}" th:text="${p+1}"></a>
                </li>
                <li class="page-item" th:classappend="${valuePage== (totalPage - 1)} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/move_manage_order(valuePage=${valuePage+1}, openMenu = ${true})}">
                        Next<i class="fas fa-chevron-right ms-1"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
