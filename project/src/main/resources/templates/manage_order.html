<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main th:fragment="manage_order" class="container my-4">

    <h2 class="mb-4 text-center">Quản lý đơn hàng</h2>
    <div class="mb-3">
        <form th:action="@{/admin/manage_order/save}" method="post" class="mb-4">
            <div class="table-responsive shadow-sm rounded">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Mã đơn hàng</th>
                        <th>Ngày đặt hàng</th>
                        <th>ID khách hàng</th>
                        <th>Tên khách hàng</th>
                        <th>Tổng tiền</th>
                        <th>Phương thức thanh toán</th>
                        <th>Địa chỉ giao hàng</th>
                        <th>Trạng thái</th>
                    </tr>

                    </thead>
                    <tbody>
                    <tr th:each="order : ${listOrder}">
                        <td th:text="${order[0]}"></td>
                        <td th:text="${#temporals.format(order[1], 'dd/MM/yyyy')}"></td>
                        <td th:text="${order[2]}"></td>
                        <td th:text="${order[3]}"></td>
                        <td th:text="${order[4]}"></td>
                        <td>
                            <span th:switch="${order[5]}">
                                <span th:case="${T(com.project.entity.enum_entity.PaymentMethod).CASH}">Tiền mặt</span>
                                <span th:case="${T(com.project.entity.enum_entity.PaymentMethod).TRANSFER}">Chuyển khoản</span>
                            </span>
                        </td>

                        <td th:text="${order[6]}"></td>
                        <td>
                            <input type="hidden" name="orderId" th:value="${order[0]}">
                            <select name="handlerOrder" class="form-select form-select-sm">
                                <option th:selected="${order[7] == null}" value="">Đang chờ xử lý</option>
                                <option th:selected="${order[7] != null and order[7].name() == 'ACCEPT'}" value="ACCEPT">Chấp nhận</option>
                                <option th:selected="${order[7] != null and order[7].name() == 'REFUSE'}" value="REFUSE">Đã hủy</option>
                            </select>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-center mt-3">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
