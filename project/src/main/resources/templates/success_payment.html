<!DOCTYPE html>
<html lang="vi" >
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán Thành Công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .modal-content {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.5s ease-out;
            overflow: hidden;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px) translateX(-50%);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateX(-50%);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #28a745, #20c997) !important;
            border-radius: 20px 20px 0 0;
            padding: 1.5rem;
            border: none;
        }

        .modal-body {
            padding: 2.5rem;
            background: white;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #28a745, #20c997);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: bounce 1s ease-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .success-message {
            background: linear-gradient(135deg, #d4edda, #e8f5e8);
            border: 2px solid #c3e6cb;
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            color: #155724;
            font-weight: 500;
        }

        .click-hint {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 25px;
            padding: 0.75rem 1.5rem;
            display: inline-block;
            animation: fadeInOut 3s infinite;
            border: 1px solid #dee2e6;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(5px);
        }

        .payment-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

<!-- Modal -->
<div class="modal fade" id="defaultModal" tabindex="-1" aria-labelledby="defaultModalLabel" aria-hidden="true">
    <div class="modal-dialog" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%);">
        <div class="modal-content border-success shadow">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title d-flex align-items-center" id="defaultModalLabel">
                    <i class="fas fa-check-circle me-2"></i>
                    <span class="ms-2">Thông Báo</span>
                </h5>
            </div>
            <div class="modal-body text-center">
                <!-- Success Icon -->
                <div class="success-icon">
                    <i class="fas fa-check text-white" style="font-size: 2rem;"></i>
                </div>

                <!-- Success Message Box -->
                <div class="success-message">
                    <i class="fas fa-party-horn me-2"></i>
                    <span class="fs-5">Chúc mừng! Bạn đã thanh toán thành công.</span>
                </div>

                <!-- Click Hint -->
                <div class="click-hint">
                    <i class="fas fa-mouse-pointer me-2 text-muted"></i>
                    <small class="text-muted">Nhấn bất kỳ đâu để trở về trang chủ</small>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Tự động hiển thị modal và redirect khi click -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
      const modalElement = document.getElementById('defaultModal');
      const modal = new bootstrap.Modal(modalElement);
      modal.show();

      // Bắt sự kiện click bất kỳ trong toàn bộ document
      document.addEventListener("click", function () {
        window.location.href = "/home_user_after_login";
      });
    });
</script>

</html>
