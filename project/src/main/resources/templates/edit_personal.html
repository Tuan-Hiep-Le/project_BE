<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thay đổi thông tin cá nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto;
        }

        .avatar-container img {
            width: 150px !important;
            height: 150px !important;
            object-fit: cover !important;
            border-radius: 50% !important;
            border: 4px solid #667eea !important;
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-container:hover .avatar-overlay {
            opacity: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }

        .form-section {
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="p-4">
<div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">
            <i class="fas fa-user-edit mr-3"></i>
            Thông tin cá nhân
        </h1>
        <p class="text-white/80">Cập nhật thông tin của bạn</p>
    </div>

    <!-- Avatar Upload Section -->
    <div class="glass-card rounded-2xl p-8 mb-6 form-section">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
            <i class="fas fa-camera mr-3 text-purple-600"></i>
            Ảnh đại diện
        </h2>

        <form th:action="@{/upload_avatar}" method="post" enctype="multipart/form-data" class="text-center">
            <div class="mb-6">
                <div class="avatar-container cursor-pointer" onclick="document.getElementById('avatar').click()">
                    <div th:if="${hasAvatar}">
                        <img th:src="@{${user.avatar}}" width="150" height="150"
                             style="border-radius: 50%; object-fit: cover; border: 4px solid #667eea;"
                             alt="Avatar" class="mx-auto">
                    </div>
                    <div th:unless="${hasAvatar}">
                        <img th:src="@{/images/sach-anh-dep3.jpg}" width="150" height="150"
                             style="border-radius: 50%; object-fit: cover; border: 4px solid #667eea;"
                             alt="Avatar" class="mx-auto">
                    </div>
                    <div class="avatar-overlay">
                        <i class="fas fa-camera text-white text-2xl"></i>
                    </div>
                </div>
                <p class="text-sm text-gray-600 mt-2">Nhấn vào ảnh để thay đổi</p>
            </div>

            <div class="input-group mb-6">
                <label for="avatar" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-image mr-2"></i>
                    Chọn ảnh mới
                </label>
                <input type="file" name="avatar" id="avatar" accept="image/*" style="display: none;" onchange="previewAvatar(this)">
                <div id="file-info" class="text-sm text-gray-500 mt-2" style="display: none;">
                    <i class="fas fa-check-circle text-green-500 mr-1"></i>
                    <span id="file-name"></span>
                </div>
                <div id="file-error" class="text-sm text-red-500 mt-2" style="display: none;">
                    <i class="fas fa-exclamation-circle mr-1"></i>
                    <span id="error-message"></span>
                </div>
            </div>

            <button type="submit" class="btn-secondary text-white font-semibold py-3 px-8 rounded-full">
                <i class="fas fa-upload mr-2"></i>
                Tải lên ảnh
            </button>
        </form>
    </div>

    <!-- Personal Information Form -->
    <div class="glass-card rounded-2xl p-8 form-section">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
            <i class="fas fa-user mr-3 text-purple-600"></i>
            Thông tin cá nhân
        </h2>

        <form th:action="@{/home_after_user_login/edit_personal}" method="post" th:object="${user}" class="space-y-6">
            <!-- Name Fields -->
            <div class="grid md:grid-cols-2 gap-6">
                <div class="input-group">
                    <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user-tag mr-2"></i>
                        Họ đệm
                    </label>
                    <input type="text" th:field="*{lastName}" id="lastName"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                           placeholder="Nhập họ đệm">
                </div>

                <div class="input-group">
                    <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-signature mr-2"></i>
                        Tên
                    </label>
                    <input type="text" th:field="*{firstName}" id="firstName"
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                           placeholder="Nhập tên">
                </div>
            </div>

            <!-- Email Field -->
            <div class="input-group">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-envelope mr-2"></i>
                    Email
                </label>
                <input type="email" th:field="*{email}" id="email"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                       placeholder="example@email.com">
            </div>

            <!-- Phone Field -->
            <div class="input-group">
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-phone mr-2"></i>
                    Số điện thoại
                </label>
                <input type="tel" th:field="*{phoneNumber}" id="phoneNumber"
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                       placeholder="Nhập số điện thoại">
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 pt-6">
                <button type="submit" class="btn-primary text-white font-semibold py-3 px-8 rounded-full flex-1">
                    <i class="fas fa-save mr-2"></i>
                    Lưu thay đổi
                </button>
                <button type="button" onclick="window.history.back()"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-8 rounded-full flex-1 transition-all duration-300">
                    <i class="fas fa-arrow-left mr-2"></i>
                    Quay lại
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Preview selected avatar image
    function previewAvatar(input) {
        const file = input.files[0];
        const fileInfo = document.getElementById('file-info');
        const fileError = document.getElementById('file-error');
        const fileName = document.getElementById('file-name');
        const errorMessage = document.getElementById('error-message');

        // Reset displays
        fileInfo.style.display = 'none';
        fileError.style.display = 'none';

        if (file) {
            // Validate file type
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
            if (!validTypes.includes(file.type)) {
                errorMessage.textContent = 'Vui lòng chọn file ảnh hợp lệ (JPG, PNG, GIF, WebP)';
                fileError.style.display = 'block';
                input.value = '';
                return;
            }

            // Validate file size (max 5MB)
            const maxSize = 5 * 1024 * 1024; // 5MB
            if (file.size > maxSize) {
                errorMessage.textContent = 'Kích thước file không được vượt quá 5MB';
                fileError.style.display = 'block';
                input.value = '';
                return;
            }

            // Show file info
            fileName.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            fileInfo.style.display = 'block';

            // Preview image
            const reader = new FileReader();
            reader.onload = function(e) {
                const avatarImages = document.querySelectorAll('.avatar-container img');
                avatarImages.forEach(img => {
                    img.src = e.target.result;
                });
            };
            reader.readAsDataURL(file);
        }
    }



    // Form validation for personal info
    document.querySelector('form[th\\:object]').addEventListener('submit', function(e) {
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!firstName || !lastName || !email) {
            e.preventDefault();
            alert('Vui lòng điền đầy đủ thông tin bắt buộc!');
        }
    });
</script>

</html>
