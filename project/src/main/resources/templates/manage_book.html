<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/manage_book.css}">
</head>
<body class="manage-book">
<main th:fragment="manage_book">
    <div class="page-header">
        <h1 class="page-title">
            <i class="fas fa-book"></i>
            Quản lý sách
        </h1>
    </div>

    <div class="controls-section">
        <a th:href="@{/admin/move_add}" type="submit" class="btn-add">
            <i class="fas fa-plus"></i>
            Thêm sản phẩm
        </a>
    </div>

    <div class="table-container">
        <table class="table">
            <thead>
            <tr>
                <th scope="col"><i class="fas fa-hashtag me-2"></i>ID Sách</th>
                <th scope="col"><i class="fas fa-book me-2"></i>Tên sách</th>
                <th scope="col"><i class="fas fa-user me-2"></i>Tác giả</th>
                <th scope="col"><i class="fas fa-language me-2"></i>Ngôn ngữ</th>
                <th scope="col"><i class="fas fa-dollar-sign me-2"></i>Giá</th>
                <th scope="col"><i class="fas fa-boxes me-2"></i>Số lượng</th>
                <th scope="col"><i class="fas fa-cogs me-2"></i>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books.content}">
                <th th:text="${book.bookId}" class="id-cell"></th>
                <td th:text="${book.nameBook}"></td>
                <td th:text="${book.nameAuthor}"></td>
                <td>
                    <span th:switch="${book.language}">
                        <span th:case="${T(com.project.entity.enum_entity.Language).ENGLISH}">Tiếng Anh</span>
                        <span th:case="${T(com.project.entity.enum_entity.Language).VIETNAMESE}">Tiếng Việt</span>
                    </span>
                </td>
                <td th:text="${#numbers.formatDecimal(book.price, 1, 'POINT', 0, 'COMMA')}" class="price-cell"></td>
                <td th:text="${book.quantity}" class="quantity-cell"></td>
                <td>
                    <div class="action-buttons">
                        <form th:action="@{/admin/remove(bookId = ${book.bookId})}" method="post" style="margin: 0;">
                            <button type="submit" class="btn-delete">
                                <i class="fas fa-trash"></i>
                                Xóa
                            </button>
                        </form>
                        <a th:href="@{/admin/move_edit(bookId = ${book.bookId})}" class="btn-edit">
                            <i class="fas fa-edit"></i>
                            Sửa
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-container" th:if="${totalPage > 0}">
        <nav aria-label="Pagination">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:class="${valuePage == 0} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/admin/manage_book(valuePage=${valuePage - 1}, openMenu=${true})}">
                        <i class="fas fa-chevron-left me-1"></i>Previous
                    </a>
                </li>

                <li class="page-item" th:each="p : ${#numbers.sequence(0, totalPage - 1)}"
                    th:class="${p == valuePage} ? 'active' : ''">
                    <a class="page-link" th:href="@{/admin/manage_book(valuePage=${p}, openMenu=${true})}" th:text="${p + 1}"></a>
                </li>

                <li class="page-item" th:class="${valuePage == totalPage - 1} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/admin/manage_book(valuePage=${valuePage + 1}, openMenu=${true})}">
                        Next<i class="fas fa-chevron-right ms-1"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

</html>
