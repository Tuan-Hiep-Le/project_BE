<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>
<body>
<main th:fragment="content">
    <div>
        <button type="submit">Them San Pham</button>
        <input ty>
    </div>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">Id Sách</th>
            <th scope="col">Tên sách</th>
            <th scope="col">Tên tác giả</th>
            <th scope="col">Ngôn ngữ</th>
            <th scope="col">Thể loại</th>
            <th scope="col">Chủ đề</th>
            <th scope="col">Giá</th>
            <th scope="col">Số lượng</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books.content}">
                <th th:text="${book.bookId}"></th>
                <td th:text="${book.nameBook}"></td>
                <td th:text="${book.nameAuthor}"></td>
                <td th:text="${book.language}"></td>
                <td th:text="${book.nameCategory}"></td>
                <td th:text="${book.nameTopic}"></td>
                <td th:text="${book.price}"></td>
                <td th:text="${book.quantity}"></td>
            </tr>
        </tbody>
    </table>
    <nav aria-label="Pagination">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${valuePage==0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/manage_book(valuePage=${valuePage-1} , openMenu=${true})}">Previous</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(0,totalPage - 1)}" th:classappend="${p == valuePage} ? 'active'">
                <a class="page-link" th:href="@{/admin/manage_book(valuePage=${p} , openMenu = ${true})}" th:text="${p+1}"></a>
            </li>
            <li class="page-item" th:classappend="${valuePage== (totalPage - 1)} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/manage_book(valuePage=${valuePage+1}, openMenu = ${true})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK" crossorigin="anonymous"></script>

</body>
</html>
