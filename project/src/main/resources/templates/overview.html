<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tổng quan</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            padding: 30px;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .dashboard-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2d3748;
            margin-bottom: 40px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInDown 0.8s ease-out;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        .stat-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover .stat-icon {
            transform: rotate(10deg) scale(1.1);
        }

        .books-card .stat-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .orders-card .stat-icon {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .users-card .stat-icon {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .revenue-card .stat-icon {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }

        .stat-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #718096;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #2d3748;
            line-height: 1;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .stat-card:hover .stat-value {
            transform: scale(1.05);
        }

        .stat-description {
            font-size: 0.9rem;
            color: #a0aec0;
            font-weight: 500;
        }

        .growth-indicator {
            display: inline-flex;
            align-items: center;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .growth-positive {
            background: rgba(72, 187, 120, 0.1);
            color: #48bb78;
        }

        .growth-neutral {
            background: rgba(66, 153, 225, 0.1);
            color: #4299e1;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            main {
                padding: 20px;
            }

            .dashboard-title {
                font-size: 2rem;
                margin-bottom: 30px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .stat-card {
                padding: 25px;
            }

            .stat-value {
                font-size: 2rem;
            }

            .stat-icon {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }
        }

        /* Loading Animation */
        .stat-value {
            background: linear-gradient(90deg, #2d3748 25%, transparent 50%, #2d3748 75%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>
<body>
<main th:fragment="overview">
    <h1 class="dashboard-title">
        <i class="fas fa-chart-line me-3"></i>
        Dashboard Tổng Quan
    </h1>

    <div class="stats-grid">
        <div class="stat-card books-card">
            <div class="stat-icon">
                <i class="fas fa-book"></i>
            </div>
            <div class="stat-label">Tổng số sách</div>
            <div class="stat-value" th:text="${totalBook}">0</div>
            <div class="stat-description">Sách có sẵn trong kho</div>
        </div>

        <div class="stat-card orders-card">
            <div class="stat-icon">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="stat-label">Tổng đơn hàng</div>
            <div class="stat-value" th:text="${totalOrder}">0</div>
            <div class="stat-description">Đơn hàng đã được xử lý</div>
        </div>

        <div class="stat-card users-card">
            <div class="stat-icon">
                <i class="fas fa-users"></i>
            </div>
            <div class="stat-label">Số người dùng</div>
            <div class="stat-value" th:text="${totalUser}">0</div>
            <div class="stat-description">Khách hàng đã đăng ký</div>

        </div>

        <div class="stat-card revenue-card">
            <div class="stat-icon">
                <i class="fas fa-dollar-sign"></i>
            </div>
            <div class="stat-label">Tổng doanh thu</div>
            <div class="stat-value" th:text="${totalRevenue}">0</div>
            <div class="stat-description">Doanh thu tích lũy</div>

        </div>
    </div>
</main>

</html>
