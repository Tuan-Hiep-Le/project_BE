<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.05)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.08)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 1;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.1),
        0 0 0 1px rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.3s ease;
    }

    .login-box:hover {
      transform: translateY(-2px);
      box-shadow:
        0 25px 50px rgba(0,0,0,0.15),
        0 0 0 1px rgba(255,255,255,0.3);
    }

    .login-title {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .login-subtitle {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-label {
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .form-control {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 0.875rem 1rem;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.8);
    }

    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      background: rgba(255,255,255,1);
      transform: translateY(-1px);
    }

    .form-control::placeholder {
      color: #9ca3af;
    }

    .form-check {
      margin: 1.5rem 0;
    }

    .form-check-input {
      border-radius: 6px;
      border: 2px solid #d1d5db;
      width: 1.2rem;
      height: 1.2rem;
    }

    .form-check-input:checked {
      background-color: #667eea;
      border-color: #667eea;
    }

    .form-check-label {
      color: #6b7280;
      font-size: 0.9rem;
      margin-left: 0.5rem;
    }

    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      padding: 0.875rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .btn-login:hover::before {
      left: 100%;
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-message {
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-top: 1rem;
      border: 1px solid #fca5a5;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .links-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }

    .auth-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .auth-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }

    .auth-link:hover {
      color: #764ba2;
      transform: translateY(-1px);
    }

    .auth-link:hover::after {
      width: 100%;
    }

    .floating-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 60px;
      height: 60px;
      top: 60%;
      right: 15%;
      animation-delay: 2s;
    }

    .shape:nth-child(3) {
      width: 40px;
      height: 40px;
      top: 80%;
      left: 20%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }

    @media (max-width: 576px) {
      .login-box {
        margin: 1rem;
        padding: 2rem 1.5rem;
      }

      .login-title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
<div class="floating-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100 login-container">
  <div class="login-box w-100" style="max-width: 420px;">
    <div class="text-center">
      <h3 class="login-title">🔐 Đăng nhập</h3>
      <p class="login-subtitle">Chào mừng bạn trở lại! Vui lòng đăng nhập vào tài khoản của bạn.</p>
    </div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label for="exampleUser" class="form-label">📧 Địa chỉ Email</label>
        <input type="email" name="email_user" class="form-control" id="exampleUser" placeholder="Nhập địa chỉ email của bạn" required>
      </div>

      <div class="mb-3">
        <label for="examplePassword" class="form-label">🔒 Mật khẩu</label>
        <input type="password" name="password_user" class="form-control" id="examplePassword" placeholder="Nhập mật khẩu của bạn" required>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" name="remember_me" class="form-check-input" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập của tôi</label>
      </div>

      <button type="submit" class="btn btn-login w-100">
        Đăng nhập ngay
      </button>
    </form>

    <div class="error-message" th:if="${isLoginSuccess == false}">
      ⚠️ Email hoặc mật khẩu không chính xác! Vui lòng thử lại.
    </div>

    <div class="text-center links-section">
      <div class="mb-2">
        <a th:href="@{/register}" class="auth-link">Chưa có tài khoản? <strong>Đăng ký ngay</strong></a>
      </div>
      <div>
        <a href="#" class="auth-link">Quên mật khẩu?</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</html>
