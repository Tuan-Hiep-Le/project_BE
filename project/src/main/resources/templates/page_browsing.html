            font-family: 'Inter', sans-serif;

            animation: pulse 2s infinite;

            50% { opacity: 0.6; }
        }
    </style>

<div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">

    <p class="text-gray-600 mb-6 leading-relaxed">
        Cảm ơn bạn đã đặt hàng! Đơn hàng của bạn đang được xem xét và sẽ được xử lý trong 1-2 ngày làm việc.
    </p>

    <!-- Trạng thái -->
    <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
        <div class="flex items-center justify-center">
                <span class="bg-yellow-200 text-yellow-800 px-3 py-1 rounded-full text-sm font-medium">
                    Chờ duyệt
                </span>

    </div>

    <!-- Nút quay về -->
    <a th:href="@{/home_user_after_login}" class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition-colors duration-200 mb-4">
        Quay về trang chủ

    <!-- Liên hệ -->
    <p class="text-sm text-gray-500">
        Cần hỗ trợ? liên hệ
        <a  class="text-blue-600 hover:underline">hiepbanhbu@gmail.com</a>
    </p>
</div>
